name: duck_auction
description: "Duck Auction App"
publish_to: 'none'

version: 1.0.0+60

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8

  firebase_core: ^3.15.1
  firebase_auth: ^5.6.2
  cloud_firestore: ^5.6.11
  firebase_storage: ^12.4.9
  firebase_analytics: ^11.6.0
  firebase_messaging: ^15.2.5
  cloud_functions: ^5.6.2
  image_picker: ^1.1.2
  image_cropper: ^8.0.0
  file_picker: ^8.3.7
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.3
  kpostal: ^2.0.0
  package_info_plus: ^8.0.0
  in_app_update: ^4.2.3
  webview_flutter: ^4.7.0
  kakao_flutter_sdk_user: ^1.9.7
  flutter_naver_login: ^2.1.1
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/image/
    - assets/image/image/
    - assets/image/icon/

  fonts:
    - family: Cafe24OhsquareAir
      fonts:
        - asset: assets/fonts/Cafe24OhsquareAir-v2.0.otf
